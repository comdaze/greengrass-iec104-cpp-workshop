---
RecipeFormatVersion: "2020-01-25"
ComponentName: "com.example.ConfigDemo"
ComponentVersion: "1.0.0"
ComponentDescription: "Configuration and logging demonstration component"
ComponentPublisher: "Workshop"

ComponentConfiguration:
  DefaultConfiguration:
    message: "Hello from Lab 2!"
    interval: 5
    logLevel: "INFO"
    logToConsole: true
    logToFile: true
    logFilePath: "/tmp/lab2-config-demo.log"
    counterThreshold: 10

Manifests:
  - Platform:
      os: "linux"
    Lifecycle:
      Install:
        Script: |
          echo "Installing ConfigDemo component..."
          chmod +x {artifacts:decompressedPath}/com.example.ConfigDemo-1.0.0/config_demo/config_demo
          
      Run:
        Script: |
          cat > /tmp/config-demo.json << EOF
          {
            "message": "{configuration:/message}",
            "interval": {configuration:/interval},
            "logLevel": "{configuration:/logLevel}",
            "logToConsole": {configuration:/logToConsole},
            "logToFile": {configuration:/logToFile},
            "logFilePath": "{configuration:/logFilePath}",
            "counterThreshold": {configuration:/counterThreshold}
          }
          EOF
          {artifacts:decompressedPath}/com.example.ConfigDemo-1.0.0/config_demo/config_demo /tmp/config-demo.json
        
      Shutdown:
        Script: |
          echo "Shutting down ConfigDemo component..."
          pkill -TERM config_demo || true
          
    Artifacts:
      - URI: "s3://iec104-greengrass-components-1769054416/com.example.ConfigDemo/1.0.0/com.example.ConfigDemo-1.0.0.zip"
        Unarchive: ZIP
